name: Build pacman repository

on:
  push:
    branches: [main]
    paths:
      - "packages/**"
      - "scripts/**"
      - "keys/**"
      - ".github/workflows/build-repo.yml"
  workflow_dispatch:
    inputs:
      force_rebuild:
        description: Rebuild all packages (ignore Pages fingerprints)
        type: boolean
        default: false
  schedule:
    - cron: "0 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: arch-repo
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build packages inside Arch Linux
        timeout-minutes: 180
        env:
          PAGES_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          FORCE_REBUILD: ${{ github.event_name == 'workflow_dispatch' && inputs.force_rebuild == true && '1' || '0' }}
          MAX_ARCH_GPG_PRIVATE_KEY: ${{ secrets.MAX_ARCH_GPG_PRIVATE_KEY }}
        run: |
          set -euo pipefail
          if [[ -z "${MAX_ARCH_GPG_PRIVATE_KEY}" ]]; then
            echo "::error::Secret MAX_ARCH_GPG_PRIVATE_KEY is not set"
            echo "Add the armored private key (Settings → Secrets and variables → Actions)."
            exit 1
          fi
          export GPGKEY
          GPGKEY="$(tr -d '[:space:]' < keys/max-arch.keyid)"
          echo "Using GPGKEY=${GPGKEY}"
          # Write key to a file so multiline armor survives into the container
          umask 077
          printf '%s\n' "${MAX_ARCH_GPG_PRIVATE_KEY}" >.signing-key.asc
          docker run --rm \
            --volume "$PWD:/src" \
            --workdir /src \
            --env PAGES_URL \
            --env FORCE_REBUILD \
            --env "GPGKEY=${GPGKEY}" \
            --env GNUPGHOME=/home/builder/.gnupg \
            archlinux:base-devel \
            bash -euo pipefail -c '
              pacman -Syu --noconfirm --needed git base-devel pacman-contrib zstd wget curl shadow gnupg
              getent group wheel >/dev/null || groupadd -r wheel
              id -u builder >/dev/null 2>&1 || useradd -m -G wheel builder
              echo "builder ALL=(ALL) NOPASSWD: ALL" >/etc/sudoers.d/builder
              chmod 0440 /etc/sudoers.d/builder
              sed -i "s/#MAKEFLAGS=\"-j2\"/MAKEFLAGS=\"-j\$(nproc)\"/" /etc/makepkg.conf
              sed -i "s/COMPRESSZST=.*/COMPRESSZST=(zstd -c -T0 --ultra -20 -)/" /etc/makepkg.conf || true
              mkdir -p /src/repo /src/.repo-cache
              install -d -m 700 -o builder -g builder /home/builder/.gnupg
              chown builder:builder /src/.signing-key.asc
              chown -R builder:builder /src/packages /src/scripts /src/repo /src/.repo-cache /src/keys
              sudo -u builder env GNUPGHOME=/home/builder/.gnupg GPGKEY="$GPGKEY" \
                gpg --batch --import /src/.signing-key.asc
              sudo -u builder env GNUPGHOME=/home/builder/.gnupg GPGKEY="$GPGKEY" \
                gpg --batch --list-secret-keys "$GPGKEY" >/dev/null
              rm -f /src/.signing-key.asc
              sudo -u builder env \
                PAGES_URL="$PAGES_URL" \
                FORCE_REBUILD="${FORCE_REBUILD:-0}" \
                GPGKEY="$GPGKEY" \
                SIGN_PACKAGES=1 \
                GNUPGHOME=/home/builder/.gnupg \
                bash /src/scripts/build-repo.sh
              chmod -R a+rX /src/repo
            '
          rm -f .signing-key.asc

      - name: Upload repository artifact
        uses: actions/upload-artifact@v4
        with:
          name: max-arch-repo
          path: repo
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download repository artifact
        uses: actions/download-artifact@v4
        with:
          name: max-arch-repo
          path: repo

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: repo

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Print pacman Server URL
        run: |
          owner="${{ github.repository_owner }}"
          name="${{ github.event.repository.name }}"
          echo "::notice::pacman Server = https://${owner}.github.io/${name}/\$arch"
          echo "::notice::public key = https://${owner}.github.io/${name}/max-arch.gpg"
